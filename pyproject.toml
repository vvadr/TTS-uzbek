[project]
name = "tts"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vvadr", email = "abdulazizyusupaliev009@example.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nemo-toolkit[asr]==2.7.3",
    "numpy>=2.5.5",
    "pyannote-audio>=4.1.0",
    "pytubefix>=11.2.1",
    "scikit-learn>=1.9.1",
    "silero-vad>=6.2.3",
    "soundfile>=0.14.0",
    "torch>=2.15.0",
    "torchaudio>=2.11.1",
    "yt-dlp>=2026.10.26",
]

[project.scripts]
tts = "tts:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
