[project]
name = "tts"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vvadr", email = "abdulazizyusupaliev009@example.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nemo-toolkit[asr] @ git+https://github.com/NVIDIA/NeMo.git@f47ddde246380a250bd868b51b4a7f3a2f3770f3",
    "numpy>=2.5.5",
    "pytubefix>=11.2.1",
    "soundfile>=0.14.0",
    "torch>=2.15.0",
    "torchaudio>=2.11.1",
    "yt-dlp>=2026.10.26",
]

[project.scripts]
tts = "tts:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# Resolve only the platforms used by this project.
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]
